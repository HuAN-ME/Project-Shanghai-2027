---
# Source: day55-demo/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: day55-dev-day55-demo
  labels:
    helm.sh/chart: day55-demo-0.1.0
    app.kubernetes.io/name: day55-demo
    app.kubernetes.io/instance: day55-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: day55-demo
    app.kubernetes.io/instance: day55-dev
---
# Source: day55-demo/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: day55-dev-day55-demo
  labels:
    helm.sh/chart: day55-demo-0.1.0
    app.kubernetes.io/name: day55-demo
    app.kubernetes.io/instance: day55-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: day55-demo
      app.kubernetes.io/instance: day55-dev
  template:
    metadata:
      labels:
        helm.sh/chart: day55-demo-0.1.0
        app.kubernetes.io/name: day55-demo
        app.kubernetes.io/instance: day55-dev
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: day55-dev-day55-demo
      containers:
        - name: day55-demo
          image: "harbor.local/project-shanghai/day50-demo:dev"
          imagePullPolicy: 
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
# Source: day55-demo/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: day55-dev-day55-demo
  labels:
    helm.sh/chart: day55-demo-0.1.0
    app.kubernetes.io/name: day55-demo
    app.kubernetes.io/instance: day55-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: nginx
  rules:
    - host: "dev.day55.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: day55-dev-day55-demo
                port:
                  number: 80
