apiVersion: apps/v1

kind: Deployment


metadata:

  name: nginx-probe-demo


spec:

  replicas: 2


  selector:

    matchLabels:

      app: nginx


  template:

    metadata:

      labels:

        app: nginx


    spec:

      containers:

      - name: nginx

        image: docker.m.daocloud.io/library/nginx:latest


        ports:

        - containerPort: 80


        livenessProbe:

          httpGet:

            path: /

            port: 80

          initialDelaySeconds: 10

          periodSeconds: 5


        readinessProbe:

          httpGet:

            path: /

            port: 80

          initialDelaySeconds: 5

          periodSeconds: 5
