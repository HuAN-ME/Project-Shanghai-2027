apiVersion: apps/v1
kind: Deployment

metadata:
  name: day51-demo
  namespace: harbor-demo


spec:

  replicas: 2


  selector:
    matchLabels:
      app: day51-demo


  template:

    metadata:
      labels:
        app: day51-demo


    spec:

      imagePullSecrets:
      - name: harbor-secret


      containers:

      - name: demo

        image: harbor.local/project-shanghai/day50-demo:v2

        ports:
        - containerPort: 80
