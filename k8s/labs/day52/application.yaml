apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: day51-demo
  namespace: argocd


spec:

  project: default


  source:

    repoURL: https://github.com/HuAN-ME/Project-Shanghai-2027.git

    targetRevision: master

    path: k8s/labs/day52/gitops/manifests


  destination:

    server: https://kubernetes.default.svc

    namespace: harbor-demo


  syncPolicy:

    automated:

      prune: true

      selfHeal: true
