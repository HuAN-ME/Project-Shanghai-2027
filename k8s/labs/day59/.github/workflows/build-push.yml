name: Day59 Build Push Harbor

on:
  workflow_dispatch:

env:
  IMAGE_NAME: harbor.local/library/day59-nginx
  IMAGE_TAG: v1

jobs:
  build-push:

    runs-on: [self-hosted, linux, rocky]

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Build image
        run: |
          docker build \
          -t $IMAGE_NAME:$IMAGE_TAG .


      - name: Login Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
          docker login harbor.local \
          -u "${{ secrets.HARBOR_USERNAME }}" \
          --password-stdin


      - name: Push image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
