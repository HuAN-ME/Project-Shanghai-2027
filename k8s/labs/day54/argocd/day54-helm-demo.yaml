apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: day54-helm-demo
  namespace: argocd


spec:

  project: default


  source:

    repoURL: https://github.com/HuAN-ME/Project-Shanghai-2027.git

    targetRevision: master

    path: k8s/labs/day54/day51-demo

    helm:
      releaseName: day54-helm-demo

  destination:

    server: https://kubernetes.default.svc

    namespace: helm-demo

  ignoreDifferences:

  - group: networking.k8s.io
    kind: Ingress
    jsonPointers:
    - /status

  syncPolicy:

    automated:

      prune: true

      selfHeal: true
